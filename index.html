<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DW5 — Delray Beach, Florida</title>
<meta name="description" content="DW5 LLC, Delray Beach, Florida. If you need jewelry, we might have it. If you need web traffic, we might have that too. Drop a line.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site"><div class="wrap hero">
  <div>
    <a class="mark" href="/" aria-label="DW5">DW<span>5</span></a>
    <p class="rotator" aria-live="off">
      <span class="rot-label">We do</span>
      <span class="rot-stage"><span class="rot-word is-on" data-i="0">Real estate</span></span>
    </p>
    <noscript><p class="rotator-static">Real estate · Digital marketing · Healthcare supplies · Consumer packaged goods · Gold and jewelry</p></noscript>
  </div>
  <svg class="art" viewBox="0 0 220 150" role="img" aria-label="Sun setting over the sea" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <defs><clipPath id="above"><rect x="0" y="0" width="220" height="92"/></clipPath></defs>
    <g stroke="#D9772B" stroke-width="1.6">
      <circle cx="132" cy="92" r="34" clip-path="url(#above)"/>
      <path d="M132 40 v-12 M162 50 l8 -8 M172 76 h12 M102 50 l-8 -8 M92 76 h-12"/>
    </g>
    <g stroke="#1A1815" stroke-width="1.6">
      <path d="M14 92 h192"/>
      <path d="M18 110 c14 -9 28 -9 42 0 s28 9 42 0 s28 -9 42 0 s28 9 42 0 s14 -6 20 -3"/>
      <path d="M26 126 c14 -9 28 -9 42 0 s28 9 42 0 s28 -9 42 0 s28 9 42 0"/>
      <path d="M40 140 c14 -8 28 -8 42 0 s28 8 42 0 s28 -8 42 0"/>
      <path d="M40 60 c4 -5 9 -5 13 0 M48 60 c4 -5 9 -5 13 0"/>
      <path d="M66 46 c3 -4 7 -4 10 0 M72 46 c3 -4 7 -4 10 0"/>
    </g>
  </svg>
</div></header>
<main><div class="wrap">
  <section class="contact">
    <h2 class="drop">Drop us a line</h2>
    <form id="contact" novalidate>
      <label>Your name<input name="name" type="text" autocomplete="name" required></label>
      <label>Your email<input name="email" type="email" autocomplete="email" required></label>
      <label>What's up?<textarea name="message" rows="5" required></textarea></label>
      <input name="company" type="text" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">
      <button type="submit">Drop a line</button>
      <p class="status" role="status" aria-live="polite"></p>
    </form>
    <p class="alt">Or just email <a href="mailto:hello@dw5.llc">hello@dw5.llc</a>.</p>
  </section>
</div></main>
<footer class="site"><div class="wrap">
  <div>DW5 LLC · Delray Beach, Florida</div>
  <div><a href="privacy.html">Privacy</a> &nbsp; <a href="terms.html">Terms</a></div>
</div></footer>
<script>
(function(){
  var words=['Real estate','Digital marketing','Healthcare supplies','Consumer packaged goods','Gold and jewelry'];
  var stage=document.querySelector('.rot-stage'); if(!stage) return;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ stage.textContent=words.join('  ·  '); return; }
  var i=0;
  setInterval(function(){
    var cur=stage.querySelector('.rot-word');
    i=(i+1)%words.length;
    var next=document.createElement('span'); next.className='rot-word'; next.textContent=words[i];
    stage.appendChild(next);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ cur.classList.remove('is-on'); cur.classList.add('is-off'); next.classList.add('is-on'); }); });
    setTimeout(function(){ if(cur.parentNode) cur.parentNode.removeChild(cur); },700);
  },2600);
})();
(function(){
  var f=document.getElementById('contact'), st=f.querySelector('.status'), btn=f.querySelector('button');
  f.addEventListener('submit',async function(e){
    e.preventDefault();
    var d=Object.fromEntries(new FormData(f).entries());
    if(!d.name.trim()||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)||!d.message.trim()){ st.textContent='Need a name, a real email, and a message.'; return; }
    btn.disabled=true; st.textContent='Sending…';
    try{
      var r=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
      var j=await r.json().catch(function(){return {};});
      if(r.ok&&j.ok){ st.textContent='Got it. Talk soon.'; f.reset(); }
      else { st.textContent=(j.error||'Something went wrong')+' — email hello@dw5.llc instead.'; btn.disabled=false; }
    }catch(err){ st.textContent='Couldn\'t send — email hello@dw5.llc instead.'; btn.disabled=false; }
  });
})();
</script>
</body>
</html>
